<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>cool fashion — Admin Dashboard</title>

<link
  rel="icon"
  href="http://localhost:5000/adobe/my-images/illustrator/tshirt.png"
>

<style>

:root{
  --bg:#faf9f6;
  --card:#fff;
  --ink:#1a1a1a;
  --accent:#7a2e2e;
  --muted:#888;
  --line:#ddd8cf;
  --success:#2e7d32;
  --warning:#b7791f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:var(--bg);
  color:var(--ink);
  padding:20px;
}

button,
input,
select,
textarea{
  font:inherit;
}

/* ==============================
   LOGIN
============================== */

.login-container{
  width:100%;
  max-width:420px;
  margin:80px auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:30px;
  box-shadow:0 5px 25px rgba(0,0,0,.05);
}

.login-container h2{
  text-align:center;
  margin-bottom:25px;
}

/* ==============================
   FORMS
============================== */

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
  text-transform:uppercase;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:5px;
  outline:none;
  background:#fff;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--accent);
}

/* ==============================
   BUTTONS
============================== */

.btn{
  border:none;
  background:var(--ink);
  color:#fff;
  padding:11px 16px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
  font-size:12px;
}

.btn:hover{
  background:var(--accent);
}

.btn-danger{
  background:var(--accent);
}

.btn-gray{
  background:#888;
}

.btn-small{
  border:none;
  padding:7px 10px;
  border-radius:4px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
}

.btn-edit{
  background:#e8e4dc;
}

.btn-delete{
  background:var(--accent);
  color:#fff;
}

/* ==============================
   DASHBOARD
============================== */

#dashboard{
  display:none;
  max-width:1250px;
  margin:auto;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding-bottom:20px;
  border-bottom:1px solid var(--line);
  margin-bottom:25px;
}

header h2{
  font-size:22px;
}

/* ==============================
   ALERT
============================== */

.alert{
  display:none;
  padding:12px;
  border-radius:5px;
  margin-bottom:18px;
  text-align:center;
  font-size:13px;
}

.alert-success{
  background:#e8f5e9;
  color:var(--success);
}

.alert-error{
  background:#ffebee;
  color:#b71c1c;
}

/* ==============================
   STATISTICS
============================== */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
  padding:20px;
}

.stat-card h4{
  font-size:11px;
  color:var(--muted);
  margin-bottom:8px;
  text-transform:uppercase;
}

.stat-value{
  color:var(--accent);
  font-size:25px;
  font-weight:bold;
}

/* ==============================
   MAIN GRID
============================== */

.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:22px;
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
  padding:22px;
  margin-bottom:22px;
}

.panel h3{
  font-size:16px;
  padding-bottom:12px;
  margin-bottom:17px;
  border-bottom:1px solid var(--line);
}

/* ==============================
   SEARCH
============================== */

.search-row{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search-row input{
  flex:1;
  padding:10px;
  border:1px solid var(--line);
  border-radius:5px;
}

.search-row select{
  padding:10px;
  border:1px solid var(--line);
  border-radius:5px;
}

/* ==============================
   PROJECTS
============================== */

.project-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:6px;
  margin-bottom:10px;
}

.project-item img{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
   flex-shrink: 0;
}

.project-info{
  flex:1;
  min-width:0;
}

.project-info strong{
  display:block;
  margin-bottom:5px;
}

.project-info small{
  color:var(--muted);
}

.project-info p{
  margin-top:5px;
  font-size:12px;
  color:#555;
}

.actions{
  display:flex;
  gap:6px;
}

/* ==============================
   NOTIFICATIONS
============================== */

.notification{
  padding:12px;
  border:1px solid var(--line);
  border-radius:5px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.notification.unread{
  border-left:4px solid var(--accent);
}

.notification small{
  color:var(--muted);
}

/* ==============================
   ORDERS
============================== */

.order{
  border:1px solid var(--line);
  padding:15px;
  border-radius:6px;
  margin-bottom:10px;
}

.order.order-unviewed{
  border-left:4px solid var(--accent);
  background:#fffaf5;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.order-info{
  font-size:13px;
  line-height:1.7;
}

.design-details{
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed var(--line);
}

.design-details-title{
  font-size:12px;
  font-weight:bold;
  color:var(--accent);
  margin-bottom:6px;
}

.color-swatch{
  display:inline-block;
  width:14px;
  height:14px;
  border-radius:3px;
  border:1px solid var(--line);
  vertical-align:middle;
  margin:0 5px;
}

.reference-image-wrap{
  margin-top:10px;
  font-size:13px;
}

.reference-image{
  display:block;
  max-width:160px;
  max-height:160px;
  object-fit:cover;
  border-radius:6px;
  border:1px solid var(--line);
  margin-top:6px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:4px;
  font-size:10px;
  font-weight:bold;
  background:#eee;
}

.status.Pending{
  color:#9a6700;
  background:#fff4cc;
}

.status.Completed{
  color:#176b20;
  background:#e4f5e6;
}

.status.Cancelled{
  color:#a11;
  background:#ffe5e5;
}

.status.In-Progress{
  color:#175ea8;
  background:#e5f0ff;
}

.badge-new{
  display:inline-block;
  padding:3px 8px;
  border-radius:4px;
  font-size:10px;
  font-weight:bold;
  background:var(--accent);
  color:#fff;
  margin-left:6px;
}

.order-controls{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

.order-controls select{
  padding:7px;
  border:1px solid var(--line);
  border-radius:4px;
}

.empty{
  color:var(--muted);
  font-size:13px;
  padding:15px 0;
}

.upload-status{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:900px){

  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  body{
    padding:10px;
  }

  header{
    align-items:flex-start;
  }

  header h2{
    font-size:17px;
  }

  .stats-grid{
    grid-template-columns:1fr 1fr;
  }

  .project-item{
    align-items:flex-start;
  }

  .actions{
    flex-direction:column;
  }

  .search-row{
    flex-direction:column;
  }

  .order-controls{
    flex-direction:column;
  }

}

</style>

</head>

<body>

<!-- ==============================
     LOGIN
============================== -->

  <h2>🔐 Admin Login</h2>

  ></div>

  <form id="loginForm">

    <div class="form-group">

        Email

    <button
      class="btn"

      style="width:100%;"

</div>


<!-- ==============================
     DASHBOARD
============================== -->

<div id="dashboard">

  <header>

    <h2>

    </h2>

    >
      Logout
    </button>

  </header>


  <div

  ></div>


  <!-- ============================
       STATISTICS
  ============================= -->

  <div class="stats-grid">

    <div class="stat-card">

      <h4>💰 Total Revenue</h4>

      <div
        class="stat-value"
        id="statRevenue"
      >
        $0
      </div>

    </div>


    <div class="stat-card">

      <h4>📁 Projects</h4>

      <div
        class="stat-value"
        id="statProjects"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <h4>📦 Total Orders</h4>

      <div
        class="stat-value"
        id="statOrders"
      >
        0
      </div>

    </div>


    <div class="stat-card">

      <h4>⏳ Pending Orders</h4>

      <div
        class="stat-value"
        id="statPending"

    </div>

  <!-- ============================
       TWO COLUMN GRID

    <!-- ==========================
         LEFT COLUMN
    =========================== -->

    <div>


      <!-- ========================
           ADD PROJECT
      ========================= -->

<script>

const API_BASE = "https://yemen-lebs.onrender.com/api/admin";


/* ==================================================
   AUTH
================================================== */

function getToken(){
  return localStorage.getItem("adminToken");
}


function getAuthHeaders(){

  const token = getToken();

  return {
    "Authorization": `Bearer ${token}`
  };

}


/* ==================================================
   VIEWED ORDERS
   LOCAL TRACKING
================================================== */

function getViewedOrderIds(){

  try{

    const raw =
      localStorage.getItem("viewedOrderIds");

    return raw
      ? JSON.parse(raw)
      : [];

  }catch(error){

    console.error(
      "❌ Viewed orders read error:",
      error
    );

    return [];

  }

}


function isOrderViewed(order){

  if(
    typeof order.viewed === "boolean"
  ){

    return order.viewed;

  }


  if(
    typeof order.read === "boolean"
  ){

    return order.read;

  }


  return getViewedOrderIds().includes(
    order._id
  );

}


function markOrderViewedLocally(id){

  const ids =
    getViewedOrderIds();

  if(!ids.includes(id)){

    ids.push(id);

    localStorage.setItem(
      "viewedOrderIds",
      JSON.stringify(ids)
    );

  }

}


/* ==================================================
   ALERT
================================================== */

function showAlert(
  message,
  isError = false
){

  const el =
    document.getElementById(
      "globalAlert"
    );

  if(!el) return;

  el.textContent =
    message;

  el.className =
    "alert " +
    (
      isError
        ? "alert-error"
        : "alert-success"
    );

  el.style.display =
    "block";

  setTimeout(() => {

    el.style.display =
      "none";

  },3000);

}


/* ==================================================
   LOGIN
================================================== */

const loginForm =
  document.getElementById(
    "loginForm"
  );


if(loginForm){

  loginForm.addEventListener(
    "submit",
    handleLogin
  );

}


async function handleLogin(e){

  e.preventDefault();


  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  const alertBox =
    document.getElementById(
      "loginAlert"
    );


  if(alertBox){

    alertBox.style.display =
      "none";

  }


  try{

    const response =
      await fetch(
        `${API_BASE}/api/admin/login`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              email,
              password
            })
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      if(alertBox){

        alertBox.textContent =
          data.message ||
          "Invalid email or password";

        alertBox.style.display =
          "block";

      }

      return;

    }


    localStorage.setItem(
      "adminToken",
      data.token
    );


    showDashboard();


  }catch(error){

    console.error(
      "❌ Login error:",
      error
    );


    if(alertBox){

      alertBox.textContent =
        "Cannot connect to server.";

      alertBox.style.display =
        "block";

    }

  }

}


/* ==================================================
   AUTH CHECK
================================================== */

async function checkAuth(){

  const token =
    getToken();


  if(!token){

    showLogin();

    return;

  }


  try{

    const response =
      await fetch(
        `${API_BASE}/api/admin/me`,
        {
          headers:
            getAuthHeaders()
        }
      );


    if(response.ok){

      showDashboard();

    }else{

      logout();

    }


  }catch(error){

    console.error(
      "❌ Auth check error:",
      error
    );

    showLogin();

  }

}


/* ==================================================
   SHOW LOGIN
================================================== */

function showLogin(){

  const login =
    document.getElementById(
      "loginSection"
    );


  const dashboard =
    document.getElementById(
      "dashboard"
    );


  if(login){

    login.style.display =
      "block";

  }


  if(dashboard){

    dashboard.style.display =
      "none";

  }

}


/* ==================================================
   SHOW DASHBOARD
================================================== */

function showDashboard(){

  const login =
    document.getElementById(
      "loginSection"
    );


  const dashboard =
    document.getElementById(
      "dashboard"
    );


  if(login){

    login.style.display =
      "none";

  }


  if(dashboard){

    dashboard.style.display =
      "block";

  }


  loadStats();
  loadNotifications();
  loadProjects();
  loadOrders();

}


/* ==================================================
   LOGOUT
================================================== */

function logout(){

  localStorage.removeItem(
    "adminToken"
  );

  showLogin();

}


/* ==================================================
   STATISTICS
   FIXED:
   Pending Orders =
   Pending AND NOT VIEWED
================================================== */

async function loadStats(){

  try{

    /* ------------------------------------------
       GET MAIN STATISTICS
    ------------------------------------------ */

    const statsResponse =
      await fetch(
        `${API_BASE}/api/admin/statistics`,
        {
          headers:
            getAuthHeaders()
        }
      );


    if(
      statsResponse.status === 401
    ){

      logout();

      return;

    }


    const statsData =
      await statsResponse.json();


    if(!statsData.success){

      console.error(
        "❌ Statistics failed:",
        statsData
      );

      return;

    }


    const stats =
      statsData.statistics || {};


    /* ------------------------------------------
       REVENUE
    ------------------------------------------ */

    const revenue =
      document.getElementById(
        "statRevenue"
      );


    if(revenue){

      revenue.textContent =
        "$" +
        Number(
          stats.revenue || 0
        ).toFixed(2);

    }


    /* ------------------------------------------
       PROJECTS
    ------------------------------------------ */

    const projects =
      document.getElementById(
        "statProjects"
      );


    if(projects){

      projects.textContent =
        stats.projects || 0;

    }


    /* ------------------------------------------
       TOTAL ORDERS
    ------------------------------------------ */

    const orders =
      document.getElementById(
        "statOrders"
      );


    if(orders){

      orders.textContent =
        stats.totalOrders || 0;

    }


    /* ------------------------------------------
       GET ALL ORDERS
       FOR VIEWED/PENDING COUNT
    ------------------------------------------ */

    const ordersResponse =
      await fetch(
        `${API_BASE}/api/orders?search=`,
        {
          headers:
            getAuthHeaders()
        }
      );


    if(
      ordersResponse.status === 401
    ){

      logout();

      return;

    }


    const ordersData =
      await ordersResponse.json();


    if(!ordersData.success){

      console.error(
        "❌ Could not load orders for pending count:",
        ordersData
      );

      return;

    }


    const allOrders =
      ordersData.orders || [];


    /* ------------------------------------------
       PENDING + UNVIEWED
    ------------------------------------------ */

    const pendingOrders =
      allOrders.filter(order => {

        const orderStatus =
          String(
            order.status ||
            "Pending"
          ).trim();


        const viewed =
          isOrderViewed(order);


        return (
          orderStatus === "Pending" &&
          !viewed
        );

      });


    console.log(
      "⏳ Pending + Unviewed:",
      pendingOrders.length
    );


    const pending =
      document.getElementById(
        "statPending"
      );


    if(pending){

      pending.textContent =
        pendingOrders.length;

    }


  }catch(error){

    console.error(
      "❌ Statistics error:",
      error
    );

  }

}


/* ==================================================
   IMAGE FILE SELECT
================================================== */

const imageFileInput =
  document.getElementById(
    "projectImageFile"
  );


if(imageFileInput){

  imageFileInput.addEventListener(
    "change",
    function(e){

      console.log(
        "🔥 FILE SELECTED"
      );


      const file =
        e.target.files &&
        e.target.files[0];


      if(!file){

        console.log(

/* ==================================================
   UPLOAD IMAGE
================================================== */

async function uploadImage(file){

  const status =
    document.getElementById(
      "uploadStatus"
    );


  const imageUrl =
    document.getElementById(
      "projectImageUrl"
    );


  console.log(
    "🚀 uploadImage() started"
  );


  if(!file){

    console.error(
      "❌ File is missing"
    );


    if(status){

      status.textContent =
        "❌ Please select an image.";

    }


    if(imageUrl){

      imageUrl.value =
        "";

    }


    return false;

  }


  /* ------------------------------------------
     IMAGE TYPE
  ------------------------------------------ */

  const allowedTypes = [

    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"

  ];


  if(
    !allowedTypes.includes(
      file.type
    )
  ){

    if(status){

      status.textContent =
        "❌ Only JPG, PNG, WEBP or GIF images are allowed.";

    }


    if(imageUrl){

      imageUrl.value =
        "";

    }


    return false;

  }


  /* ------------------------------------------
     IMAGE SIZE
  ------------------------------------------ */

  const maxSize =
    10 * 1024 * 1024;


  if(file.size > maxSize){

    if(status){

      status.textContent =
        "❌ Image must be smaller than 10MB.";

    }


    if(imageUrl){

      imageUrl.value =
        "";

    }


    return false;

  }


  if(status){

    status.textContent =
      "⏳ Uploading image...";

  }


  const formData =
    new FormData();


  formData.append(
    "image",
    file
  );


  try{

    const response =
      await fetch(
        `${API_BASE}/api/upload`,
        {
          method:"POST",

          headers:
            getAuthHeaders(),

          body:
            formData
        }
      );


    console.log(
      "📡 Upload HTTP status:",
      response.status
    );


    let data;


    try{

      data =
        await response.json();

    }catch(error){

      console.error(
        "❌ Invalid server response:",
        error
      );


      if(status){

        status.textContent =
          "❌ Server returned invalid response.";

      }


      return false;

    }


    console.log(
      "📤 Upload response:",
      data
    );


    if(
      response.status === 401
    ){

      logout();

      return false;

    }


    if(
      !response.ok ||
      !data.success
    ){

      if(status){

        status.textContent =
          "❌ " +
          (
            data.message ||
            "Upload failed."
          );

      }


      if(imageUrl){

        imageUrl.value =
          "";

      }


      return false;

    }


    const savedUrl =
      data.url ||
      data.image ||
      data.path ||
      "";


    if(!savedUrl){

      if(status){

        status.textContent =
          "❌ Server did not return image URL.";

      }


      return false;

    }


    if(imageUrl){

      imageUrl.value =
        savedUrl;

    }


    console.log(
      "✅ IMAGE URL SAVED:",
      savedUrl
    );


    if(status){

      status.textContent =
        "✅ Image uploaded successfully";

      status.style.color =
        "green";

    }


    return true;


  }catch(error){

    console.error(
      "❌ Upload error:",
      error
    );


    if(status){

      status.textContent =
        "❌ Server connection failed.";

    }


    return false;

  }

}

async function loadProjects(){

    document.getElementById(
      "searchInput"
    );


  const categoryEl =
    document.getElementById(
      "filterCategory"
    );


  const container =
    document.getElementById(
      "projectsList"
    );


  if(
    !searchEl ||
    !categoryEl ||
    !container
  ){

    return;

  }


  const search =
    searchEl.value.trim();


  const category =
    categoryEl.value;


  try{

    let url =
      `${API_BASE}/api/projects?search=${encodeURIComponent(search)}`;


    if(
      category &&
      category !== "all"
    ){

      url +=
        `&category=${encodeURIComponent(category)}`;

    }


    const response =
      await fetch(
        url,
        {
          headers:
            getAuthHeaders()
        }
      );


    if(
      response.status === 401
    ){

      logout();

      return;

    }


    const data =
      await response.json();


    console.log(
      "📁 Projects response:",
      data
    );


    container.innerHTML =
      "";


    if(
      !data.success ||
      !data.projects ||
      data.projects.length === 0
    ){

      container.innerHTML = `
        <div class="empty">
          No projects found.
        </div>
      `;

      return;

    }


    data.projects.forEach(
      project => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "project-item";


        let image =
          "";


        if(project.image){

          image =
            project.image.startsWith("http")
              ? project.image
              :
              API_BASE +
              (
                project.image.startsWith("/")
                  ? project.image
                  : "/" + project.image
              );

        }


        item.innerHTML = `

          ${
            image
              ?
              `
                <img
                  src="${escapeHTML(image)}"
                  alt="Project"
                  onerror="this.style.display='none'"
                >
              `
              :
              ""
          }


          <div class="project-info">

            <strong>
              ${escapeHTML(
                project.title || ""
              )}
            </strong>

            <small>
              ${escapeHTML(
                project.category || ""
              )}
            </small>

            ${
              project.description
                ?
                `
                  <p>
                    ${escapeHTML(
                      project.description
                    )}
                  </p>
                `
                :
                ""
            }

          </div>


          <div class="actions">

            <button
              class="btn-small btn-edit"
              onclick='setupEdit(${JSON.stringify(project)})'
            >
              Edit
            </button>


            <button
              class="btn-small btn-delete"
              onclick="deleteProject('${project._id}')"
            >
              Delete
            </button>

          </div>

        `;


        container.appendChild(
          item
        );

      }
    );


  }catch(error){

    console.error(
      "❌ Projects error:",
      error
    );


    container.innerHTML = `
      <div class="empty">
        Cannot load projects.
      </div>
    `;

  }

}

================================================== */

async function handleProjectSubmit(e){

  e.preventDefault();


  console.log(
    "💾 SAVE PROJECT CLICKED"
  );


  const id =
    document
      .getElementById("projectId")
      .value
      .trim();


  const title =
    document
      .getElementById("projectTitle")
      .value
      .trim();


  const category =
    document
      .getElementById("projectCategory")
      .value;


  const description =
    document
      .getElementById("projectDescription")
      .value
      .trim();


  const imageUrlInput =
    document.getElementById(
      "projectImageUrl"
    );


  const fileInput =
    document.getElementById(
      "projectImageFile"
    );


  let image =
    imageUrlInput
      ? imageUrlInput.value.trim()
      : "";


  const file =
    fileInput &&
    fileInput.files &&
    fileInput.files.length > 0
      ?
      fileInput.files[0]
      :
      null;


  console.log(
    "📋 SAVE DATA:",
    {
      id,
      title,
      category,
      description,
      image,
      file
    }
  );


  if(!title){

    showAlert(
      "Please enter project title.",
      true
    );

    return;

  }


  if(!category){

    showAlert(
      "Please select a category.",
      true
    );

    return;

  }


  /* ------------------------------------------
     UPLOAD NEW IMAGE
  ------------------------------------------ */

  if(file){

    const uploadSuccess =
      await uploadImage(
        file
      );


    if(!uploadSuccess){

      showAlert(
        "Image upload failed.",
        true
      );

      return;

    }


    image =
      imageUrlInput
        ? imageUrlInput.value.trim()
        : "";

  }


  if(!image){

    showAlert(
      "Please select an image.",
      true
    );

    return;

  }


  const payload = {

    title,
    category,
    description,
    image

  };


  console.log(
    "📦 PROJECT PAYLOAD:",
    payload
  );


  const isEdit =
    Boolean(id);


  const url =
    isEdit
      ?
      `${API_BASE}/api/projects/${id}`
      :
      `${API_BASE}/api/projects`;


  try{

    const response =
      await fetch(
        url,
        {
          method:
            isEdit
              ? "PUT"
              : "POST",

          headers:{

            ...getAuthHeaders(),

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    console.log(
      "📡 Project HTTP status:",
      response.status
    );


    if(
      response.status === 401
    ){

      logout();

      return;

    }


    const data =
      await response.json();


    console.log(
      "💾 Project save response:",
      data
    );


    if(
      !response.ok ||
      !data.success
    ){

      showAlert(
        data.message ||
        "Operation failed.",
        true
      );

      return;

    }


    showAlert(
      isEdit
        ?
        "Project updated successfully!"
        :
        "Project added successfully!"
    );


    resetForm();


    await loadProjects();
    await loadStats();
    await loadNotifications();


  }catch(error){

    console.error(
      "❌ Project save error:",
      error
    );


    showAlert(
      "Server error while saving project.",
      true
    );

  }

}

async function loadNotifications(){

  const container =
    document.getElementById(
      "notificationArea"
    );


  if(!container){

    return;

  }


  try{

    const response =
      await fetch(
        `${API_BASE}/api/admin/notifications`,
        {
          headers:
            getAuthHeaders()
        }
      );


    if(
      response.status === 401
    ){

      logout();

      return;

    }


    const data =
      await response.json();


    if(!data.success){

      container.innerHTML = `
        <div class="empty">
          Cannot load notifications.
        </div>
      `;

      return;

    }


    const unreadCount =
      document.getElementById(
        "unreadCount"
      );


    if(unreadCount){

      unreadCount.textContent =
        data.unread || 0;

    }


    container.innerHTML =
      "";


    const unreadNotifications =
      (data.notifications || [])
        .filter(
          notification =>
            notification.read !== true
        )
        .slice(0,10);


    if(
      unreadNotifications.length === 0
    ){

      container.innerHTML = `
        <div class="empty">
          No notifications.
        </div>
      `;

      return;

    }


    unreadNotifications.forEach(
      notification => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "notification unread";


        item.innerHTML = `

          <div>

            <strong>
              ${escapeHTML(
                notification.title ||
                "Notification"
              )}
            </strong>

            <br>

            <small>
              ${escapeHTML(
                notification.message ||
                ""
              )}
            </small>

          </div>


          <button
            class="btn-small btn-edit"
            onclick="markRead('${notification._id}')"
          >
            Mark Read
          </button>

        `;


        container.appendChild(
          item
        );

      }
    );


  }catch(error){

    console.error(
      "❌ Notifications error:",
      error
    );

  }

}

              :
              ""
          }


          <div class="order-controls">

            <select
              id="status-${order._id}"
              aria-label="Order Status"
            >

              <option
                ${
                  order.status === "Pending"
                    ? "selected"
                    : ""
                }
              >
                Pending
              </option>


              <option
                ${
                  order.status === "In Progress"
                    ? "selected"
                    : ""
                }
              >
                In Progress
              </option>


              <option
                ${
                  order.status === "Completed"
                    ? "selected"
                    : ""
                }
              >
                Completed
              </option>


              <option
                ${
                  order.status === "Cancelled"
                    ? "selected"
                    : ""
                }
              >
                Cancelled
              </option>

            </select>


            <button
              class="btn-small btn-edit"
              onclick="updateOrderStatus('${order._id}')"
            >
              Update Status
            </button>


            <button
              class="btn-small btn-edit"
              onclick="markOrderViewed('${order._id}')"
            >
              ✅ Mark as Viewed
            </button>

          </div>

        `;


        container.appendChild(
          item
        );

      }
    );


  }catch(error){

    console.error(
      "❌ Orders error:",
      error
    );


    container.innerHTML = `
      <div class="empty">
        Cannot load orders.
      </div>
    `;

  }

}


/* ==================================================
   MARK ORDER AS VIEWED
   FIXED:
   1. Save locally
   2. Hide order
   3. Recalculate pending count
   4. Try backend
================================================== */

async function markOrderViewed(id){

  console.log(
    "👁️ MARK ORDER AS VIEWED:",
    id
  );


  /* ------------------------------------------
     SAVE VIEWED STATE FIRST
  ------------------------------------------ */

  markOrderViewedLocally(
    id
  );


  /* ------------------------------------------
     IMMEDIATELY UPDATE UI
  ------------------------------------------ */

  await loadOrders();


  /* ------------------------------------------
     IMPORTANT:
     UPDATE PENDING COUNT
  ------------------------------------------ */

  await loadStats();


  /* ------------------------------------------
     TRY BACKEND
  ------------------------------------------ */

  try{

    const response =
      await fetch(
        `${API_BASE}/api/orders/${id}/viewed`,
        {
          method:"PATCH",

          headers:
            getAuthHeaders()
        }
      );


    if(
      response.status === 401
    ){

      logout();

      return;

    }


    if(response.ok){

      console.log(
        "✅ Viewed status saved to backend."
      );

    }else{

      console.warn(
        "⚠️ Backend viewed route unavailable. Local status is being used."
      );

    }


  }catch(error){

    console.warn(
      "⚠️ Could not save viewed status to backend. Local status remains active.",
      error
    );

  }

}


/* ==================================================
   UPDATE ORDER STATUS
================================================== */

async function updateOrderStatus(id){

  const select =
    document.getElementById(
      `status-${id}`
    );


  if(!select){

    console.error(
      "❌ Order status select not found:",
      id
    );

    return;

  }


  const status =
    select.value;


  try{

    const response =
      await fetch(
        `${API_BASE}/api/orders/${id}/status`,
        {
          method:"PATCH",

          headers:{

            ...getAuthHeaders(),

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({
              status
            })

        }
      );


    if(
      response.status === 401
    ){

      logout();

      return;

    }


    const data =
      await response.json();


    console.log(
      "📦 Status update:",
      data
    );


    if(
      !response.ok ||
      !data.success
    ){

      showAlert(
        data.message ||
        "Could not update order.",
        true
      );

      return;

    }


    showAlert(
      "Order status updated!"
    );


    await loadOrders();
    await loadStats();
    await loadNotifications();


  }catch(error){

    console.error(
      "❌ Update order error:",
      error
    );


    showAlert(
      "Server error updating order.",
      true
    );

  }

}


/* ==================================================
   FULL IMAGE URL
================================================== */

function getFullImageUrl(image){

  if(!image){

    return "";

  }


  if(
    image.startsWith("http")
  ){

    return image;

  }


  return (
    API_BASE +
    (
      image.startsWith("/")
        ?
        image
        :
        "/" + image
    )
  );

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value == null
      ? ""
      : String(value);


  return div.innerHTML;

}
