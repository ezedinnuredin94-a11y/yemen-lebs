
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment — Yemen Lebs</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f7f5f1;
    color:#171717;
    min-height:100vh;
}

.container{
    width:92%;
    max-width:900px;
    margin:40px auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.payment-box{
    background:#fff;
    border-radius:15px;
    padding:30px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.section{
    margin-bottom:30px;
}

.section h2{
    font-size:20px;
    margin-bottom:15px;
}

.order-info{
    background:#f7f5f1;
    padding:18px;
    border-radius:10px;
    line-height:1.8;
}

.method{
    position:relative;
    margin:12px 0;
}

.method input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.method-label{
    display:block;
    padding:18px;
    border:2px solid #ddd;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
    background:#fff;
}

.method-label:hover{
    border-color:#7A2E2E;
}

.method input:checked + .method-label{
    border-color:#7A2E2E;
    background:#faf3f3;
    box-shadow:0 0 0 1px #7A2E2E;
}

.method-title{
    font-weight:bold;
    font-size:17px;
}

.method-description{
    margin-top:5px;
    color:#777;
    font-size:14px;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:25px;
}

.btn{
    flex:1;
    border:0;
    padding:16px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-pay{
    background:#7A2E2E;
    color:white;
}

.btn-pay:hover{
    background:#612323;
}

.btn-back{
    background:#ddd;
    color:#222;
}

#status{
    margin-top:18px;
    text-align:center;
    font-weight:bold;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.modal-content{
    background:#fff;
    width:90%;
    max-width:450px;
    padding:35px;
    border-radius:15px;
    text-align:center;
}

.success-icon{
    font-size:55px;
    margin-bottom:15px;
}

.modal-content h2{
    margin-bottom:10px;
}

.modal-content p{
    color:#666;
    line-height:1.6;
}

@media(max-width:600px){
    .container{
        width:95%;
        margin:20px auto;
    }

    .payment-box{
        padding:20px;
    }

    .buttons{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Payment</h1>

    <div class="payment-box">

        <!-- ORDER INFORMATION -->
        <div class="section">
            <h2>Order Information</h2>

            <div class="order-info">
                <p>
                    <strong>Package:</strong>
                    <span id="packageName">Loading...</span>
                </p>

                <p>
                    <strong>Price:</strong>
                    $<span id="packagePrice">0.00</span>
                </p>

                <p>
                    <strong>Customer:</strong>
                    <span id="customerName">Loading...</span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="customerEmail">Loading...</span>
                </p>
            </div>
        </div>


        <!-- PAYMENT METHODS -->
        <div class="section">

            <h2>Choose Payment Method</h2>

            <div class="method">

                <input
                    type="radio"
                    name="paymentMethod"
                    id="bank"
                    value="Bank Transfer"
                >

                <label
                    for="bank"
                    class="method-label"
                >
                    <div class="method-title">
                        Bank Transfer
                    </div>

                    <div class="method-description">
                        Pay through bank transfer.
                    </div>
                </label>

            </div>


            <div class="method">

                <input
                    type="radio"
                    name="paymentMethod"
                    id="telebirr"
                    value="Telebirr"
                >

                <label
                    for="telebirr"
                    class="method-label"
                >
                    <div class="method-title">
                        Telebirr
                    </div>

                    <div class="method-description">
                        Pay using Telebirr.
                    </div>
                </label>

            </div>


            <div class="method">

                <input
                    type="radio"
                    name="paymentMethod"
                    id="other"
                    value="Other"
                >

                <label
                    for="other"
                    class="method-label"
                >
                    <div class="method-title">
                        Other
                    </div>

                    <div class="method-description">
                        Other payment method.
                    </div>
                </label>

            </div>

        </div>


        <!-- BUTTONS -->
        <div class="buttons">

            <button
                type="button"
                class="btn btn-back"
                id="backButton"
            >
                Back
            </button>

            <button
                type="button"
                class="btn btn-pay"
                id="payButton"
            >
                Place Order
            </button>

        </div>


        <p id="status"></p>

    </div>

</div>


<!-- SUCCESS MODAL -->
<div class="modal" id="successModal">

    <div class="modal-content">

        <div class="success-icon">
            ✅
        </div>

        <h2>Order Confirmed!</h2>

        <p>
            Your order has been successfully submitted.
        </p>

        <p>
            Redirecting to confirmation...
        </p>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_BASE = "https://yemen-lebs.onrender.com/api/auth/payment";

/* =========================================================
   LOAD LOCAL STORAGE DATA
========================================================= */

const reviewedOrder =
    JSON.parse(
        localStorage.getItem("reviewedOrder") || "{}"
    );

const selectedPackage =
    JSON.parse(
        localStorage.getItem("selectedPackage") || "{}"
    );

const user =
    JSON.parse(
        localStorage.getItem("user") || "{}"
    );

const designDetails =
    JSON.parse(
        localStorage.getItem("designDetails") || "{}"
    );


/* =========================================================
   CUSTOMER INFORMATION
========================================================= */

const savedFirstName =
    localStorage.getItem("firstName") || "";

const savedLastName =
    localStorage.getItem("lastName") || "";

const savedEmail =
    localStorage.getItem("email") || "";


const customerName =
    `${savedFirstName} ${savedLastName}`.trim()
    ||
    user.name
    ||
    reviewedOrder.customer?.name
    ||
    "Customer";


const customerEmail =
    savedEmail
    ||
    user.email
    ||
    reviewedOrder.customer?.email
    ||
    "No email";


/* =========================================================
   PACKAGE INFORMATION
========================================================= */

const packageName =
    selectedPackage.name
    ||
    selectedPackage.package
    ||
    reviewedOrder.package
    ||
    localStorage.getItem("packageName")
    ||
    "Basic";


const packagePrices = {
    Basic: 5,
    Standard: 15,
    Premium: 35
};


let packagePrice =
    Number(
        selectedPackage.price
        ||
        reviewedOrder.amount
        ||
        localStorage.getItem("packagePrice")
        ||
        packagePrices[packageName]
        ||
        0
    );


/* =========================================================
   DESIGN INFORMATION
========================================================= */

const designType =
    designDetails.designType
    ||
    reviewedOrder.design?.designType
    ||
    localStorage.getItem("designType")
    ||
    reviewedOrder.service
    ||
    "Fashion Design";


const patternStyle =
    designDetails.patternStyle
    ||
    reviewedOrder.design?.patternStyle
    ||
    localStorage.getItem("patternStyle")
    ||
    "";


const fileType =
    designDetails.fileType
    ||
    reviewedOrder.design?.fileType
    ||
    localStorage.getItem("fileType")
    ||
    "";


const color =
    designDetails.color
    ||
    reviewedOrder.design?.color
    ||
    localStorage.getItem("designColor")
    ||
    "";


const colorName =
    designDetails.colorName
    ||
    reviewedOrder.design?.colorName
    ||
    "";


const size =
    designDetails.size
    ||
    reviewedOrder.design?.size
    ||
    localStorage.getItem("designSize")
    ||
    "";


const quantity =
    Number(
        designDetails.quantity
        ||
        reviewedOrder.design?.quantity
        ||
        localStorage.getItem("designQuantity")
        ||
        1
    );


const description =
    designDetails.description
    ||
    reviewedOrder.design?.description
    ||
    localStorage.getItem("designDescription")
    ||
    "";


const additionalInstructions =
    designDetails.additionalInstructions
    ||
    reviewedOrder.design?.additionalInstructions
    ||
    localStorage.getItem("additionalInstructions")
    ||
    "";


/* =========================================================
   REFERENCE IMAGE
========================================================= */

const referenceImageUrl =
    localStorage.getItem("referenceImageUrl")
    ||
    designDetails.referenceImage
    ||
    reviewedOrder.design?.referenceImage
    ||
    "";


/* =========================================================
   DISPLAY DATA
========================================================= */

document.getElementById("packageName").textContent =
    packageName;

document.getElementById("packagePrice").textContent =
    packagePrice.toFixed(2);

document.getElementById("customerName").textContent =
    customerName;

document.getElementById("customerEmail").textContent =
    customerEmail;


/* =========================================================
   DEBUG
========================================================= */

console.log("====================================");
console.log("💳 PAYMENT PAGE LOADED");
console.log("👤 CUSTOMER:", customerName);
console.log("📧 EMAIL:", customerEmail);
console.log("📦 PACKAGE:", packageName);
console.log("💰 PRICE:", packagePrice);
console.log("🎨 DESIGN:", designType);
console.log("====================================");


/* =========================================================
   PAYMENT METHOD SELECTION
   EXTRA HANDLER TO MAKE SURE RADIO IS CHECKED
========================================================= */

document.querySelectorAll(".method").forEach(method => {

    method.addEventListener("click", function(){

        const radio =
            this.querySelector(
                'input[type="radio"]'
            );

        if(radio){

            radio.checked = true;

            radio.dispatchEvent(
                new Event("change", {
                    bubbles:true
                })
            );

            console.log(
                "💳 PAYMENT METHOD SELECTED:",
                radio.value
            );
        }

    });

});


/* =========================================================
   ALSO HANDLE LABEL CLICK
========================================================= */

document.querySelectorAll(".method-label").forEach(label => {

    label.addEventListener("click", function(){

        const radioId =
            this.getAttribute("for");

        const radio =
            document.getElementById(radioId);

        if(radio){

            radio.checked = true;

            console.log(
                "💳 LABEL SELECTED:",
                radio.value
            );

        }

    });

});


/* =========================================================
   BACK BUTTON
========================================================= */

document
    .getElementById("backButton")
    .addEventListener("click", function(){

        history.back();

    });


/* =========================================================
   GENERATE ORDER NUMBER
========================================================= */

function generateOrderNumber(){

    const random =
        Math.floor(
            10000000 +
            Math.random() * 90000000
        );

    return "YL-" + random;

}


/* =========================================================
   PROCESS PAYMENT
========================================================= */

async function processPayment(){

    console.log("🚀 PROCESS PAYMENT STARTED");

    const status =
        document.getElementById("status");

    status.textContent = "";
    status.style.color = "#7A2E2E";


    /* -----------------------------------------------
       GET SELECTED PAYMENT METHOD
    ----------------------------------------------- */

    const selectedMethod =
        document.querySelector(
            'input[name="paymentMethod"]:checked'
        );


    console.log(
        "💳 SELECTED METHOD:",
        selectedMethod
    );


    /* -----------------------------------------------
       CHECK PAYMENT METHOD
    ----------------------------------------------- */

    if(!selectedMethod){

        status.textContent =
            "Please select a payment method.";

        status.style.color = "red";

        alert(
            "Please select a payment method first."
        );

        return;

    }


    const paymentMethod =
        selectedMethod.value;


    console.log(
        "💳 PAYMENT METHOD VALUE:",
        paymentMethod
    );


    /* -----------------------------------------------
       ORDER NUMBER
    ----------------------------------------------- */

    const orderNumber =
        generateOrderNumber();


    console.log(
        "🔢 ORDER NUMBER:",
        orderNumber
    );


    /* =================================================
       FINAL ORDER FOR confirmation.html
    ================================================= */

    const finalOrder = {

        orderNumber: orderNumber,

        package: packageName,

        amount: packagePrice,

        paymentMethod: paymentMethod,

        paymentStatus: "Pending",

        orderStatus: "Processing",

        customer: {

            name: customerName,

            email: customerEmail

        },

        design: {

            designType: designType,

            patternStyle: patternStyle,

            fileType: fileType,

            color: color,

            colorName: colorName,

            size: size,

            description: description,

            quantity: quantity,

            additionalInstructions:
                additionalInstructions,

            referenceImage:
                referenceImageUrl

        },

        createdAt:
            new Date().toISOString()

    };


    console.log(
        "📦 FINAL ORDER:",
        finalOrder
    );


    /* =================================================
       BACKEND ORDER
    ================================================= */

    const backendOrder = {

        service:
            designType,

        package:
            packageName,

        price:
            packagePrice,

        name:
            customerName,

        email:
            customerEmail,

        notes:
            description,

        designType:
            designType,

        patternStyle:
            patternStyle,

        fileType:
            fileType,

        color:
            color,

        colorName:
            colorName,

        size:
            size,

        quantity:
            quantity,

        additionalInstructions:
            additionalInstructions,

        referenceImage:
            referenceImageUrl

    };


    console.log(
        "📤 BACKEND ORDER:",
        backendOrder
    );


    /* =================================================
       SEND ORDER TO BACKEND
    ================================================= */

    try{

        status.textContent =
            "Submitting your order...";

        status.style.color =
            "#7A2E2E";


        const response =
            await fetch(
                `${API_BASE}/api/orders`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            backendOrder
                        )
                }
            );


        console.log(
            "📥 SERVER STATUS:",
            response.status
        );


        const data =
            await response.json();


        console.log(
            "📥 SERVER RESPONSE:",
            data
        );


        /* -------------------------------------------
           BACKEND ERROR
        ------------------------------------------- */

        if(!response.ok){

            throw new Error(
                data.message
                ||
                data.error
                ||
                "Order submission failed."
            );

        }


        /* =================================================
           SAVE ORDER LOCALLY
        ================================================= */

        localStorage.setItem(
            "finalOrder",
            JSON.stringify(finalOrder)
        );


        localStorage.setItem(
            "paymentData",
            JSON.stringify(finalOrder)
        );


        /* Save backend order ID if returned */
        if(data.order){

            if(data.order._id){

                localStorage.setItem(
                    "orderId",
                    data.order._id
                );

            }

            if(data.order.id){

                localStorage.setItem(
                    "orderId",
                    data.order.id
                );

            }

        }


        console.log(
            "✅ FINAL ORDER SAVED:",
            JSON.parse(
                localStorage.getItem(
                    "finalOrder"
                )
            )
        );


        /* =================================================
           SUCCESS MODAL
        ================================================= */

        document.getElementById(
            "successModal"
        ).style.display = "flex";


        status.textContent =
            "Order submitted successfully!";

        status.style.color =
            "green";


        /* =================================================
           REDIRECT TO CONFIRMATION
        ================================================= */

        console.log(
            "➡️ REDIRECTING TO CONFIRMATION..."
        );


        setTimeout(function(){

            window.location.href =
                "http://127.0.0.1:5500/clothing/confirmation.html";

        }, 1000);


    }

    catch(error){

        console.error(
            "❌ PAYMENT ERROR:",
            error
        );


        status.textContent =
            "Error: " + error.message;

        status.style.color =
            "red";


        alert(
            "Order failed.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   DESKTOP PAY BUTTON
========================================================= */

document
    .getElementById("payButton")
    .addEventListener(
        "click",
        processPayment
    );


console.log(
    "✅ Pay button connected."
);


/* =========================================================
   MOBILE PAY BUTTON
   If your old page has payButtonMobile,
   this will connect it too.
========================================================= */

const mobileButton =
    document.getElementById(
        "payButtonMobile"
    );


if(mobileButton){

    mobileButton.addEventListener(
        "click",
        processPayment
    );

    console.log(
        "✅ Mobile Pay button connected."
    );

}


/* =========================================================
   TEST FUNCTION
   You can run processPayment() from console.
========================================================= */

window.processPayment =
    processPayment;


</script>

</body>
</html>
